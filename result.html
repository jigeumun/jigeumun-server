<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>지금운 사주 분석 결과</title>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Nanum Myeongjo', serif;
background-color:#0b1320;
background-image:url("https://www.transparenttextures.com/patterns/rice-paper.png");
color:white;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

.hero{
text-align:center;
margin-bottom:50px;
}

.hero h1{
font-size:40px;
color:#d4af37;
letter-spacing:3px;
}

/* 팔자표 */

.saju-table{
background:rgba(20,28,47,0.9);
border-radius:12px;
padding:20px;
margin-bottom:30px;
border:1px solid rgba(212,175,55,0.2);
}

table{
width:100%;
border-collapse:collapse;
text-align:center;
}

th{
color:#d4af37;
padding:10px;
}

td{
padding:15px;
font-size:22px;
}

/* 오행 그래프 */

.elementBox{
background:rgba(20,28,47,0.9);
border-radius:12px;
padding:25px;
margin-bottom:30px;
}

.elementRow{
margin-bottom:12px;
}

.bar{
height:12px;
background:#6366f1;
border-radius:10px;
}

/* 카드 */

.card{
background:rgba(20,28,47,0.9);
border-radius:12px;
padding:30px;
margin-bottom:25px;
border:1px solid rgba(212,175,55,0.2);
}

.card h2{
color:#d4af37;
}

</style>

</head>

<body>

<div class="container">

<div class="hero">
<h1>🔮 지금운 사주 분석 결과</h1>
</div>

<div class="saju-table">

<table>

<tr>
<th>시주</th>
<th>일주</th>
<th>월주</th>
<th>년주</th>
</tr>

<tr>
<td id="hour">-</td>
<td id="day">-</td>
<td id="month">-</td>
<td id="year">-</td>
</tr>

</table>

</div>

<div class="elementBox">

<h3>오행 밸런스</h3>

<div class="elementRow">목
<div class="bar" id="wood"></div>
</div>

<div class="elementRow">화
<div class="bar" id="fire"></div>
</div>

<div class="elementRow">토
<div class="bar" id="earth"></div>
</div>

<div class="elementRow">금
<div class="bar" id="metal"></div>
</div>

<div class="elementRow">수
<div class="bar" id="water"></div>
</div>

</div>

<div id="result"></div>

</div>

<script>

const rawText = localStorage.getItem("sajuResult");

const sajuData = JSON.parse(localStorage.getItem("sajuData") || "{}");

document.getElementById("year").innerText = sajuData.year || "-";
document.getElementById("month").innerText = sajuData.month || "-";
document.getElementById("day").innerText = sajuData.day || "-";
document.getElementById("hour").innerText = sajuData.hour || "-";

const elements = {
wood: Math.floor(Math.random()*100),
fire: Math.floor(Math.random()*100),
earth: Math.floor(Math.random()*100),
metal: Math.floor(Math.random()*100),
water: Math.floor(Math.random()*100)
};

document.getElementById("wood").style.width = elements.wood+"%";
document.getElementById("fire").style.width = elements.fire+"%";
document.getElementById("earth").style.width = elements.earth+"%";
document.getElementById("metal").style.width = elements.metal+"%";
document.getElementById("water").style.width = elements.water+"%";

function render(){

const container = document.getElementById("result");

if(!rawText){
container.innerHTML="<div class='card'>분석 결과 없음</div>";
return;
}

const paragraphs = rawText.split("\n\n");

paragraphs.forEach((text,index)=>{

if(text.trim()==="") return;

const card=document.createElement("div");

card.className="card";

card.innerHTML=`
<h2>분석 ${index+1}</h2>
<p>${text}</p>
`;

container.appendChild(card);

});

}

render();

</script>

</body>
</html>
