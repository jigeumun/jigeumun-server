<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>나의 사주 분석 결과</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
background:#020617;
color:white;
font-family:'Noto Sans KR',sans-serif;
display:flex;
justify-content:center;
}

.container{
width:100%;
max-width:420px;
padding:24px;
}

.title{
text-align:center;
font-size:26px;
margin-bottom:20px;
}

.card{
background:#0f172a;
border-radius:16px;
padding:18px;
margin-top:14px;
border:1px solid rgba(99,102,241,0.3);
}

.pillars{
display:flex;
justify-content:space-between;
font-size:22px;
margin-top:10px;
}

.pillar{
text-align:center;
}

.shareBox{
display:flex;
gap:10px;
margin-top:25px;
}

button{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.kakao{
background:#FEE500;
color:black;
}

.imageBtn{
background:#6366f1;
color:white;
}

</style>

</head>

<body>

<div class="container" id="captureArea">

<div class="title">🔮 나의 사주 분석 결과</div>

<div class="card">

<h3>사주 팔자</h3>

<div class="pillars">

<div class="pillar">
년주<br>
<strong id="year"></strong>
</div>

<div class="pillar">
월주<br>
<strong id="month"></strong>
</div>

<div class="pillar">
일주<br>
<strong id="day"></strong>
</div>

<div class="pillar">
시주<br>
<strong id="hour"></strong>
</div>

</div>

</div>

<div class="card">
<h3>오행 균형</h3>
<canvas id="fiveChart"></canvas>
</div>

<div class="card">
<h3>📅 2026년 월별 운세 흐름</h3>
<canvas id="yearChart"></canvas>
</div>

<div class="card">
<h3>🌙 대운 흐름</h3>
<div id="luckFlow"></div>
</div>

<div id="analysis"></div>

<div class="shareBox">

<button class="kakao" onclick="shareKakao()">카카오 공유</button>

<button class="imageBtn" onclick="downloadImage()">이미지 저장</button>

</div>

</div>

<script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

Kakao.init("b93117f37a0e66e258cf0dfd07796271");

//////////////////////////////////////////////////////
// 로컬 데이터 불러오기
//////////////////////////////////////////////////////

const sajuText=localStorage.getItem("sajuResult");
const sajuData=JSON.parse(localStorage.getItem("sajuData"));
const elementsJSON=localStorage.getItem("elements");

//////////////////////////////////////////////////////
// 사주 표시
//////////////////////////////////////////////////////

if(sajuData){

document.getElementById("year").innerText=sajuData.year;
document.getElementById("month").innerText=sajuData.month;
document.getElementById("day").innerText=sajuData.day;
document.getElementById("hour").innerText=sajuData.hour;

}

//////////////////////////////////////////////////////
// GPT 결과 표시
//////////////////////////////////////////////////////

function renderResult(text){

const sections=text.split(/\n\d+\./);

let html="<div class='card'><h3>🔮 사주 정밀 분석</h3>";

sections.forEach(section=>{

if(section.trim().length<20) return;

const lines=section.trim().split("\n");

const title=lines[0];
const body=lines.slice(1).join("<br>");

html+=`
<div style="margin-top:15px">
<b>${title}</b><br>
${body}
</div>
`;

});

html+="</div>";

document.getElementById("analysis").innerHTML=html;

}

if(sajuText) renderResult(sajuText);

//////////////////////////////////////////////////////
// 오행 그래프
//////////////////////////////////////////////////////

if(elementsJSON){

const elements=JSON.parse(elementsJSON);

const ctx=document.getElementById("fiveChart");

new Chart(ctx,{

type:"radar",

data:{
labels:["목","화","토","금","수"],
datasets:[{
label:"오행",
data:[
elements["목"],
elements["화"],
elements["토"],
elements["금"],
elements["수"]
]
}]
}

});

}

//////////////////////////////////////////////////////
// 2026 월별 운세 그래프
//////////////////////////////////////////////////////

const months=[
"1월","2월","3월","4월","5월","6월",
"7월","8월","9월","10월","11월","12월"
];

const fortune=[];

for(let i=0;i<12;i++){

fortune.push(Math.floor(Math.random()*40)+60);

}

const ctx2=document.getElementById("yearChart");

if(ctx2){

new Chart(ctx2,{

type:"line",

data:{
labels:months,
datasets:[{
label:"2026 운세 흐름",
data:fortune,
borderColor:"#facc15",
backgroundColor:"rgba(250,204,21,0.2)"
}]
}

});

}

//////////////////////////////////////////////////////
// 대운 흐름
//////////////////////////////////////////////////////

function renderLuck(){

const ages=[20,30,40,50,60];

let html="";

ages.forEach(age=>{

html+=`
<div style="margin-top:10px">
${age}세 ~ ${age+10}세
</div>
`;

});

document.getElementById("luckFlow").innerHTML=html;

}

renderLuck();

//////////////////////////////////////////////////////
// 이미지 저장
//////////////////////////////////////////////////////

function downloadImage(){

html2canvas(document.querySelector("#captureArea")).then(canvas=>{

const link=document.createElement("a");

link.download="saju_result.png";

link.href=canvas.toDataURL();

link.click();

});

}

//////////////////////////////////////////////////////
// 카카오 공유
//////////////////////////////////////////////////////

function shareKakao(){

Kakao.Share.sendDefault({

objectType:"feed",

content:{
title:"🔮 AI 사주 분석 결과",
description:"나의 사주 분석 결과 확인하기",
imageUrl:"https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png",
link:{
mobileWebUrl:location.origin,
webUrl:location.origin
}
}

});

}

</script>

</body>
</html>
