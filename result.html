<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>나의 사주 분석 결과</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#020617;
color:white;
font-family:'Nanum Myeongjo',serif;
margin:0;
padding:20px;
}

.container{
max-width:420px;
margin:auto;
}

.title{
font-size:24px;
text-align:center;
margin-bottom:20px;
}

.card{
background:#0f172a;
padding:18px;
border-radius:14px;
margin-bottom:18px;
}

.hanjaPillars{
display:flex;
justify-content:space-between;
margin-top:15px;
font-size:34px;
font-weight:bold;
color:#facc15;
text-align:center;
}

.elementBars{
margin-top:10px;
}

.elementRow{
margin-top:6px;
font-size:14px;
}

.bar{
height:10px;
border-radius:6px;
margin-top:4px;
}

.wood{background:#22c55e}
.fire{background:#ef4444}
.earth{background:#c2410c}
.metal{background:#e5e7eb}
.water{background:#3b82f6}

.daewoonCard{
padding:10px;
margin-top:10px;
border-radius:10px;
background:rgba(255,255,255,0.04);
}

.shareBox{
margin-top:20px;
text-align:center;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
margin:5px;
cursor:pointer;
}

.kakao{
background:#FEE500;
}

.imageBtn{
background:#6366f1;
color:white;
}

</style>

</head>

<body>

<div class="container" id="captureArea">

<div class="title">🔮 나의 사주 분석 결과</div>

<!-- 사주 팔자 -->

<div class="card">

<h3>사주 팔자</h3>

<div class="hanjaPillars">

<div id="hanjaYear">-</div>
<div id="hanjaMonth">-</div>
<div id="hanjaDay">-</div>
<div id="hanjaHour">-</div>

</div>

</div>

<!-- 오행 -->

<div class="card">

<h3>오행 균형</h3>

<canvas id="fiveChart"></canvas>

<div class="elementBars" id="elementBars"></div>

</div>

<!-- 월별 -->

<div class="card">

<h3>📅 2026년 월별 운세</h3>

<canvas id="yearChart"></canvas>

</div>

<!-- 대운 -->

<div class="card">

<h3>🌙 대운 흐름</h3>

<div id="luckFlow"></div>

</div>

<!-- GPT 분석 -->

<div id="analysis"></div>

<div class="shareBox">

<button class="kakao" onclick="shareKakao()">카카오 공유</button>

<button class="imageBtn" onclick="downloadImage()">이미지 저장</button>

</div>

</div>

<script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

Kakao.init("b93117f37a0e66e258cf0dfd07796271")

//////////////////////////////////////////////////////
// 데이터 불러오기
//////////////////////////////////////////////////////

const sajuText = localStorage.getItem("sajuResult")
const elementsJSON = localStorage.getItem("elements")
const fortuneJSON = localStorage.getItem("fortune")
const daewoonJSON = localStorage.getItem("daewoon")
const hanjaJSON = localStorage.getItem("hanja")

//////////////////////////////////////////////////////
// 한자 사주
//////////////////////////////////////////////////////

if(hanjaJSON){

const hanja=JSON.parse(hanjaJSON)

document.getElementById("hanjaYear").innerText=hanja.year || "-"
document.getElementById("hanjaMonth").innerText=hanja.month || "-"
document.getElementById("hanjaDay").innerText=hanja.day || "-"
document.getElementById("hanjaHour").innerText=hanja.hour || "-"

}

//////////////////////////////////////////////////////
// GPT 분석
//////////////////////////////////////////////////////

function renderResult(text){

const sections=text.split(/\n\d+\./)

let html="<div class='card'><h3>🔮 사주 정밀 분석</h3>"

sections.forEach(section=>{

if(section.trim().length<10) return

const lines=section.trim().split("\n")

const title=lines[0]
const body=lines.slice(1).join("<br>")

html+=`

<div style="margin-top:15px">

<b>${title}</b><br>

${body}

</div>

`

})

html+="</div>"

document.getElementById("analysis").innerHTML=html

}

if(sajuText) renderResult(sajuText)

//////////////////////////////////////////////////////
// 오행 그래프
//////////////////////////////////////////////////////

if(elementsJSON){

const elements=JSON.parse(elementsJSON)

const ctx=document.getElementById("fiveChart")

new Chart(ctx,{

type:"radar",

data:{
labels:["목","화","토","금","수"],
datasets:[{
label:"오행",
data:[
elements.wood||0,
elements.fire||0,
elements.earth||0,
elements.metal||0,
elements.water||0
],
backgroundColor:"rgba(250,204,21,0.2)",
borderColor:"#facc15"
}]
}

})

//////////////////////////////////////////////////////
// 오행 바
//////////////////////////////////////////////////////

let html=""

html+=createBar("목",elements.wood,"wood")
html+=createBar("화",elements.fire,"fire")
html+=createBar("토",elements.earth,"earth")
html+=createBar("금",elements.metal,"metal")
html+=createBar("수",elements.water,"water")

document.getElementById("elementBars").innerHTML=html

}

function createBar(name,value,cls){

if(!value) value=0

const width=value*25

return`

<div class="elementRow">

${name}

<div class="bar ${cls}" style="width:${width}px"></div>

</div>

`

}

//////////////////////////////////////////////////////
// 월별 운세
//////////////////////////////////////////////////////

if(fortuneJSON){

const fortune=JSON.parse(fortuneJSON)

const months=[

"1월","2월","3월","4월","5월","6월",
"7월","8월","9월","10월","11월","12월"

]

const ctx2=document.getElementById("yearChart")

new Chart(ctx2,{

type:"line",

data:{
labels:months,
datasets:[{
label:"2026 운세",
data:fortune,
borderColor:"#facc15",
backgroundColor:"rgba(250,204,21,0.2)",
tension:0.3
}]
}

})

}

//////////////////////////////////////////////////////
// 대운
//////////////////////////////////////////////////////

if(daewoonJSON){

const daewoon=JSON.parse(daewoonJSON)

let html=""

daewoon.forEach(d=>{

html+=`

<div class="daewoonCard">

${d.ageStart}세 ~ ${d.ageEnd}세

<br>

<strong>${d.hanja}</strong>

</div>

`

})

document.getElementById("luckFlow").innerHTML=html

}

//////////////////////////////////////////////////////
// 이미지 저장
//////////////////////////////////////////////////////

function downloadImage(){

html2canvas(document.querySelector("#captureArea")).then(canvas=>{

const link=document.createElement("a")

link.download="saju_result.png"

link.href=canvas.toDataURL()

link.click()

})

}

//////////////////////////////////////////////////////
// 카카오 공유
//////////////////////////////////////////////////////

function shareKakao(){

Kakao.Share.sendDefault({

objectType:"feed",

content:{
title:"🔮 AI 사주 분석 결과",
description:"나의 사주 결과 확인하기",
imageUrl:"https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png",
link:{
mobileWebUrl:location.origin,
webUrl:location.origin
}
}

})

}

</script>

</body>
</html>
