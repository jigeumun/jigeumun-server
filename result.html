<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<title>나의 사주 분석 결과</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
background:#020617;
color:white;
font-family:'Nanum Myeongjo',serif;
margin:0;
padding:20px;
}

.container{
max-width:420px;
margin:auto;
}

.title{
font-size:24px;
text-align:center;
margin-bottom:20px;
}

.card{
background:#0f172a;
padding:18px;
border-radius:14px;
margin-bottom:18px;
}

.hanjaPillars{
display:flex;
justify-content:space-between;
margin-top:15px;
font-size:34px;
font-weight:bold;
color:#facc15;
text-align:center;
}

.elementBars{
margin-top:10px;
}

.elementRow{
margin-top:6px;
font-size:14px;
}

.bar{
height:10px;
border-radius:6px;
margin-top:4px;
}

.wood{background:#22c55e}
.fire{background:#ef4444}
.earth{background:#c2410c}
.metal{background:#e5e7eb}
.water{background:#3b82f6}

.daewoonCard{
padding:10px;
margin-top:10px;
border-radius:10px;
background:rgba(255,255,255,0.04);
}

.shareBox{
margin-top:20px;
text-align:center;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
margin:5px;
cursor:pointer;
}

.kakao{
background:#FEE500;
}

.imageBtn{
background:#6366f1;
color:white;
}

.compatBtn{
background:#22c55e;
color:white;
width:100%;
margin-top:10px;
}

</style>

</head>

<body>

<div class="container" id="captureArea">

<div class="title">🔮 나의 사주 분석 결과</div>

<div class="card">
<h3>사주 팔자</h3>
<div class="hanjaPillars">
<div id="hanjaYear">-</div>
<div id="hanjaMonth">-</div>
<div id="hanjaDay">-</div>
<div id="hanjaHour">-</div>
</div>
</div>

<div class="card">
<h3>오행 균형</h3>
<canvas id="fiveChart"></canvas>
<div class="elementBars" id="elementBars"></div>
</div>

<div class="card">
<h3>📅 2026년 월별 운세</h3>
<canvas id="yearChart"></canvas>
</div>

<div class="card">
<h3>🌙 대운 흐름</h3>
<div id="luckFlow"></div>
</div>

<div id="analysis"></div>

<div class="card">
<h3>🔥 AI 인생 총운</h3>
<div id="lifeFortune"></div>
</div>

<div class="card">
<h3>💰 2026 재물 흐름</h3>
<canvas id="moneyChart"></canvas>
</div>

<div class="card">
<h3>🌞 오늘의 운세</h3>
<div id="todayLuck"></div>
</div>

<div class="card">
<h3>💼 AI 직업 추천</h3>
<div id="jobRecommend"></div>
</div>

<div class="card">
<h3>💞 친구와 궁합 보기</h3>

<input type="date" id="friendBirth" style="width:100%;padding:10px;border-radius:8px;border:none">

<button class="compatBtn" onclick="checkCompatibility()">궁합 확인하기</button>

<div id="compatibilityResult"></div>

</div>

<div class="shareBox">
<button class="kakao" onclick="shareKakao()">카카오 공유</button>
<button class="imageBtn" onclick="downloadImage()">이미지 저장</button>
</div>

</div>

<script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

Kakao.init("b93117f37a0e66e258cf0dfd07796271")

const sajuText = localStorage.getItem("sajuResult")
const elementsJSON = localStorage.getItem("elements")
const fortuneJSON = localStorage.getItem("fortune")
const daewoonJSON = localStorage.getItem("daewoon")
const hanjaJSON = localStorage.getItem("hanja")

//////////////////////////////////////////////////
AI 인생 총운
//////////////////////////////////////////////////

const lifeFortuneList=[

"젊은 시기보다 중년 이후 운이 강해지는 사주입니다.",

"재물과 인간관계에서 균형이 중요한 인생 흐름입니다.",

"초반 고생 후 안정되는 인생 구조입니다.",

"변화 속에서 기회를 만드는 운입니다.",

"성공은 꾸준함에서 오는 사주입니다."

]

document.getElementById("lifeFortune").innerText=
lifeFortuneList[Math.floor(Math.random()*lifeFortuneList.length)]

//////////////////////////////////////////////////
재물 그래프
//////////////////////////////////////////////////

const moneyData=[

Math.floor(Math.random()*50)+40,
Math.floor(Math.random()*50)+40,
Math.floor(Math.random()*50)+40,
Math.floor(Math.random()*50)+40,
Math.floor(Math.random()*50)+40,
Math.floor(Math.random()*50)+40

]

new Chart(document.getElementById("moneyChart"),{

type:"line",

data:{
labels:["1월","3월","5월","7월","9월","11월"],
datasets:[{
label:"재물 흐름",
data:moneyData,
borderColor:"#22c55e",
backgroundColor:"rgba(34,197,94,0.2)"
}]
}

})

//////////////////////////////////////////////////
오늘의 운세
//////////////////////////////////////////////////

const todayLuckList=[

"오늘은 새로운 기회를 발견할 수 있는 날입니다.",
"오늘은 조심스러운 판단이 필요한 하루입니다.",
"인연과 만남에서 좋은 흐름이 들어옵니다.",
"금전과 관련된 작은 기회가 생길 수 있습니다."

]

document.getElementById("todayLuck").innerText=
todayLuckList[Math.floor(Math.random()*todayLuckList.length)]

//////////////////////////////////////////////////
직업 추천
//////////////////////////////////////////////////

const jobList=[

"사업가 / 창업",
"기획자 / 전략가",
"금융 / 투자 분야",
"교육 / 컨설팅",
"마케팅 / 영업",
"프리랜서 / 창작 활동"

]

document.getElementById("jobRecommend").innerText=
jobList[Math.floor(Math.random()*jobList.length)]

//////////////////////////////////////////////////
궁합
//////////////////////////////////////////////////

function checkCompatibility(){

const friendBirth=document.getElementById("friendBirth").value

if(!friendBirth){
alert("친구 생년월일을 입력해주세요.")
return
}

const results=[

"🌟 서로 보완되는 궁합입니다.",
"🔥 성향 차이가 있지만 서로 자극이 됩니다.",
"💰 재물 협력에 좋은 궁합입니다.",
"🌙 정서적으로 안정감을 주는 관계입니다."

]

const random=Math.floor(Math.random()*results.length)

document.getElementById("compatibilityResult").innerText=results[random]

}

//////////////////////////////////////////////////
이미지 저장
//////////////////////////////////////////////////

function downloadImage(){

html2canvas(document.querySelector("#captureArea")).then(canvas=>{

const link=document.createElement("a")
link.download="saju_result.png"
link.href=canvas.toDataURL()
link.click()

})

}

//////////////////////////////////////////////////
카카오 공유
//////////////////////////////////////////////////

function shareKakao(){

Kakao.Share.sendDefault({

objectType:"feed",

content:{
title:"🔮 AI 사주 분석 결과",
description:"나의 사주 결과 확인하기",
imageUrl:"https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png",
link:{
mobileWebUrl:location.origin,
webUrl:location.origin
}
}

})

}

</script>

</body>
</html>
